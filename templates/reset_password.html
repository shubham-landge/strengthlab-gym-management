<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · StrengthLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand">
      <img class="login-logo" src="{{ url_for('static', filename='strengthlab-logo.jpeg') }}" alt="StrengthLab">
      <div><strong>StrengthLab</strong><small>Set new password</small></div>
    </div>
    <h1>Set new password</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if user %}
    <p class="hint">Account: {{ user.username }}</p>
    <form method="post" class="login-form">
      <input name="new_password" type="password" placeholder="New password, minimum 8 characters" autocomplete="new-password" required>
      <input name="confirm_password" type="password" placeholder="Confirm new password" autocomplete="new-password" required>
      <button class="button primary" type="submit">Reset password</button>
    </form>
    {% endif %}
    <p class="hint"><a href="{{ url_for('login') }}">Back to login</a></p>
  </main>
</body>
</html>
