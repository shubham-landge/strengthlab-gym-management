<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password · StrengthLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand">
      <img class="login-logo" src="{{ url_for('static', filename='strengthlab-logo.jpeg') }}" alt="StrengthLab">
      <div><strong>StrengthLab</strong><small>Password recovery</small></div>
    </div>
    <h1>Reset password</h1>
    <p class="hint">Enter your login ID or mobile number. The reset link is shown to admin/front desk for local use.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if reset_link %}
    <div class="notice good">
      Reset link created: <a href="{{ reset_link }}">{{ reset_link }}</a>
    </div>
    {% endif %}
    <form method="post" class="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="username" placeholder="Mobile number or login ID" autocomplete="username" required>
      <button class="button primary" type="submit">Create reset link</button>
    </form>
    <p class="hint"><a href="{{ url_for('login') }}">Back to login</a></p>
  </main>
</body>
</html>
