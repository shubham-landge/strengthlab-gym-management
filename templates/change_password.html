<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password · StrengthLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand">
      <img class="login-logo" src="{{ url_for('static', filename='strengthlab-logo.jpeg') }}" alt="StrengthLab">
      <div><strong>StrengthLab</strong><small>Secure password update</small></div>
    </div>
    <h1>Change password</h1>
    <p class="hint">For security, choose a new password before continuing.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" class="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="current_password" type="password" placeholder="Current password" autocomplete="current-password" required>
      <input name="new_password" type="password" placeholder="New password, minimum 8 characters" autocomplete="new-password" required>
      <input name="confirm_password" type="password" placeholder="Confirm new password" autocomplete="new-password" required>
      <button class="button primary" type="submit">Update password</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}" class="login-form secondary-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Logout</button>
    </form>
  </main>
</body>
</html>
