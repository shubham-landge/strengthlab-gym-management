<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · StrengthLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand">
      <img class="login-logo" src="{{ url_for('static', filename='strengthlab-logo.jpeg') }}" alt="StrengthLab">
      <div>
        <strong>StrengthLab</strong>
        <small>Secure dashboard</small>
      </div>
    </div>
    <h1>Sign in</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" class="login-form">
      <input name="username" placeholder="Username" autocomplete="username" required>
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="button primary" type="submit">Login</button>
    </form>
    <p class="hint">Demo: admin/admin123, trainer/trainer123, member/member123</p>
  </main>
</body>
</html>
