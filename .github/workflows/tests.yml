name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check the app boots and serves a page
        env:
          PORT: "5001"
          GYM_DB_PATH: /tmp/ci_smoke.db
          DISABLE_PAYMENT_AUTOMATION: "1"
          SECRET_KEY: ci-smoke-key
        run: |
          python app.py &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:5001/login; then
              echo "app is serving"
              exit 0
            fi
            sleep 1
          done
          echo "app did not start in time" >&2
          exit 1
